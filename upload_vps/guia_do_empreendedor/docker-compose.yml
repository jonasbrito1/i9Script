services:
  guia-backend:
    image: node:18-alpine
    container_name: guia-empreendedor-backend
    restart: always
    network_mode: host
    working_dir: /app
    environment:
      NODE_ENV: production
      API_PORT: 5001
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - guia_node_modules:/app/node_modules
    command: sh -c "npm install && npx tsx server/index.ts"

volumes:
  guia_node_modules:
    name: guia-empreendedor-node-modules
    driver: local
