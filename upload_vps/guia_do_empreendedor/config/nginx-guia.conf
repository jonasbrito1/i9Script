# Configuração Nginx para Guia do Empreendedor
# Hospedado em i9script.com/guiadoempreendedor

location /guiadoempreendedor {
    alias /var/www/i9script/guia_do_empreendedor/frontend;
    try_files $uri $uri/ /guiadoempreendedor/index.html;

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# API do Guia do Empreendedor
location /guiadoempreendedor/api {
    rewrite ^/guiadoempreendedor/api/(.*) /api/$1 break;
    proxy_pass http://localhost:5001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
}
