# Configuração completa Nginx para i9script.com
# Inclui i9script (raiz) e Guia do Empreendedor (subdiretório)

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name i9script.com www.i9script.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/i9script.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i9script.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # IMPORTANTE: NÃO colocar "root" aqui no nível do server
    # Cada location terá seu próprio root/alias
    index index.html;

    # Guia do Empreendedor Frontend (MAIS ESPECÍFICO PRIMEIRO)
    location ^~ /guiadoempreendedor {
        alias /var/www/i9script/guia_do_empreendedor/frontend;
        index index.html;
        try_files $uri $uri/ /guiadoempreendedor/index.html;

        # Cache para assets estáticos
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API do Guia do Empreendedor (porta 5001)
    location /guiadoempreendedor/api {
        rewrite ^/guiadoempreendedor/api/(.*) /api/$1 break;
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # API Backend i9script (porta 5000)
    location /api {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Frontend i9script - Handle React Router (MENOS ESPECÍFICO, POR ÚLTIMO)
    location / {
        root /var/www/i9script/frontend;
        try_files $uri $uri/ /index.html;

        # Cache para assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /var/www/i9script/frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name i9script.com www.i9script.com;
    return 301 https://$server_name$request_uri;
}
