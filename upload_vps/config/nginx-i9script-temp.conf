# Configuração TEMPORÁRIA do Nginx (sem SSL)
# Usada apenas para gerar o certificado SSL

server {
    listen 80;
    listen [::]:80;
    server_name i9script.com www.i9script.com;

    # Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Temporariamente servir frontend
    root /var/www/i9script/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
