<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bgGrad)"/>

  <!-- Border -->
  <rect x="1" y="1" width="62" height="62" rx="11" fill="none" stroke="url(#textGrad)" stroke-width="0.5" opacity="0.5"/>

  <!-- Text і9 usando Russo One style -->
  <text x="32" y="45" font-family="'Russo One', Arial, sans-serif" font-size="36" font-weight="700" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)">і9</text>

  <!-- Accent dot on і -->
  <circle cx="18" cy="15" r="2.5" fill="url(#textGrad)" filter="url(#glow)"/>
</svg>
