services:
  mysql:
    image: mysql:8.0
    container_name: i9script-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: i9script
      MYSQL_USER: i9script
      MYSQL_PASSWORD: i9script123
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - i9script-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      timeout: 20s
      retries: 10
      interval: 10s
    labels:
      - "com.i9script.description=i9Script MySQL Database"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: i9script-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root123
      UPLOAD_LIMIT: 100M
    ports:
      - "8082:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - i9script-network
    labels:
      - "com.i9script.description=i9Script phpMyAdmin"

  i9script-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: i9script-website
    ports:
      - "4444:80"
    volumes:
      # Volume para desenvolvimento - permite hot reload
      - ./:/usr/share/nginx/html/:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
      - TZ=America/Manaus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.i9script.description=i9Script Website Container"
      - "com.i9script.version=1.0"

  # Serviço opcional para logs e monitoramento
  nginx-logs:
    image: busybox:latest
    container_name: i9script-logs
    volumes:
      - logs-volume:/var/log/nginx
    command: sh -c "sleep 10 && tail -f /var/log/nginx/access.log /var/log/nginx/error.log 2>/dev/null || echo 'Aguardando logs...'"
    depends_on:
      - i9script-web
    restart: unless-stopped
    labels:
      - "com.i9script.description=i9Script Logs Monitor"

networks:
  i9script-network:
    driver: bridge

volumes:
  mysql_data:
    name: i9script-mysql-data
    driver: local
  logs-volume:
    name: i9script-logs
    driver: local